version: '3.8'

services:
  # ─── PostgreSQL Databases ────────────────────────────────────────────────────
  postgres-auth:
    image: postgres:15
    container_name: omnistock-postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnistock_auth
    ports:
      - "5431:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:15
    container_name: omnistock-postgres-product
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnistock_product
    ports:
      - "5433:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15
    container_name: omnistock-postgres-inventory
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnistock_inventory
    ports:
      - "5434:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15
    container_name: omnistock-postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnistock_order
    ports:
      - "5435:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Eureka Server ────────────────────────────────────────────────────────────
  eureka-server:
    build: ./eureka-server
    container_name: omnistock-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: omnistock-auth
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/omnistock_auth
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-omnistock-super-secret-key-must-be-at-least-256-bits-long-for-hmacsha256}
      EUREKA_URI: http://eureka-server:8761/eureka
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-your_email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-your_app_password}
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ─── Product Service ──────────────────────────────────────────────────────────
  product-service:
    build: ./product-service
    container_name: omnistock-product
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres-product:5432/omnistock_product
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      postgres-product:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ─── Inventory Service ────────────────────────────────────────────────────────
  inventory-service:
    build: ./inventory-service
    container_name: omnistock-inventory
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres-inventory:5432/omnistock_inventory
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      EUREKA_URI: http://eureka-server:8761/eureka
      LOW_STOCK_THRESHOLD: 25
    depends_on:
      postgres-inventory:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ─── Order Service ────────────────────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: omnistock-order
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres-order:5432/omnistock_order
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLYWAY_ENABLED: "true"
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      postgres-order:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

  # ─── API Gateway ──────────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: omnistock-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-omnistock-super-secret-key-must-be-at-least-256-bits-long-for-hmacsha256}
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  postgres-auth-data:
  postgres-product-data:
  postgres-inventory-data:
  postgres-order-data:
